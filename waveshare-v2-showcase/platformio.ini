[platformio]
default_envs = waveshare28v2

[env:waveshare28v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  lvgl/lvgl@^9.2.0
  moononournation/GFX Library for Arduino@^1.6.0
build_flags =
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_USE_LOG=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_28=1
  -D LV_MEM_SIZE=65536
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

# Optional BLE test. Separate build deliberately keeps Bluetooth out of the
# stable showcase. The previous remote experiment had a controller crash.
[env:waveshare28v2-ble]
extends = env:waveshare28v2
build_flags =
  ${env:waveshare28v2.build_flags}
  -D ENABLE_BLE_TEST=1
