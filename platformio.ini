; Root PlatformIO entrypoint for the Waveshare V2 showcase.
; Open this repository root in VS Code and select "waveshare28v2".
[platformio]
default_envs = waveshare28v2
src_dir = waveshare-v2-showcase/src

[env:waveshare28v2]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
lib_deps =
    lvgl/lvgl@9.2.2
    moononournation/GFX Library for Arduino@1.6.9
build_flags =
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_MEM_SIZE=65536
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_28=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
